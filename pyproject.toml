[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eda-process-mlops"
version = "0.1.0"
description = "EDA process for Google BigQuery datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-bigquery>=3.0.0",
    "pandas>=2.0.0",
    "xlsxwriter>=3.0.0",
    "db-dtypes>=1.0.0",
]

[project.scripts]
eda-process = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
